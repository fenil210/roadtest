[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roadtest"
version = "0.1.0"
description = "Road-test your AI agent before it ships: scenario-based evals for any agent, written by your coding agent."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Fenil Ramoliya" }]
keywords = ["agents", "evals", "evaluation", "llm", "testing", "ai", "llm-judge", "agent-skills"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/fenil210/roadtest"
Documentation = "https://github.com/fenil210/roadtest#readme"
Issues = "https://github.com/fenil210/roadtest/issues"

[project.scripts]
roadtest = "roadtest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/roadtest"]

# The skill lives at the repo root so `npx skills add` and the Claude Code plugin find it.
# It is copied into the package so `roadtest init` and `roadtest guide` work after a pip install.
[tool.hatch.build.targets.wheel.force-include]
"skills/roadtest" = "roadtest/skill"

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
