# Publishes to PyPI when a GitHub release is published.
# One-time setup: on pypi.org add a trusted publisher for this repository
# (owner fenil210, repository roadtest, workflow release.yml, environment pypi).
name: release
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/roadtest/__init__.py)
          tag="$GITHUB_REF_NAME"
          tagged="${tag#[vV]}"     # v0.1.2, V0.1.2 and 0.1.2 all mean 0.1.2
          tagged="${tagged#.}"     # and so does v.0.1.2
          if [ "$tagged" != "$version" ]; then
            echo "::error::The release tag $tag is for version $tagged, but the package is $version (src/roadtest/__init__.py). If this release is $version, give it the tag v$version. If it is a new version, set __version__ to $tagged, push, then publish the release."
            exit 1
          fi
          echo "Publishing roadtest $version from tag $tag"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
