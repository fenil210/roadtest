# Publishes to PyPI when a GitHub release is published.
# One-time setup: on pypi.org add a trusted publisher for this repository
# (owner fenil210, repository roadtest, workflow release.yml, environment pypi).
name: release
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/roadtest/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The release tag is $GITHUB_REF_NAME but src/roadtest/__init__.py says $version. Set __version__ to match, push, then publish the release again."
            exit 1
          fi
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
